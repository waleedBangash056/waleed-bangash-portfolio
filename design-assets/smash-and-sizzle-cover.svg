<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="867" viewBox="0 0 1200 867" role="img" aria-labelledby="title desc">
<title id="title">Smash &amp; Sizzle restaurant demo — editorial cover</title>
<desc id="desc">A dark, high-end restaurant landing-page artwork with warm amber accents, a layered smash burger illustration, and menu-focused calls to action.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b1411"/><stop offset=".55" stop-color="#2a1511"/><stop offset="1" stop-color="#0d0e0e"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#e85b25" stop-opacity=".45"/><stop offset="1" stop-color="#e85b25" stop-opacity="0"/></radialGradient>
  <linearGradient id="bun" x1="0" y1="0" x2="0.2" y2="1"><stop stop-color="#f6c77d"/><stop offset=".48" stop-color="#d88b3e"/><stop offset="1" stop-color="#8a3c20"/></linearGradient>
  <linearGradient id="bunTop" x1="0" y1="0" x2=".35" y2="1"><stop stop-color="#ffdc98"/><stop offset=".38" stop-color="#eaa552"/><stop offset=".8" stop-color="#b75c2b"/><stop offset="1" stop-color="#72351f"/></linearGradient>
  <linearGradient id="patty" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#43231d"/><stop offset=".32" stop-color="#1f1513"/><stop offset=".7" stop-color="#3e211a"/><stop offset="1" stop-color="#100f0f"/></linearGradient>
  <linearGradient id="cheese" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#ffd15c"/><stop offset=".7" stop-color="#ff9d20"/><stop offset="1" stop-color="#dc511b"/></linearGradient>
  <linearGradient id="lettuce" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a8b64c"/><stop offset="1" stop-color="#385f32"/></linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="867" fill="url(#bg)"/>
<rect width="1200" height="867" fill="url(#grid)" opacity=".22"/>
<ellipse cx="845" cy="424" rx="430" ry="415" fill="url(#glow)"/>
<path d="M720 150C900 95 1030 185 1098 330S1101 600 976 690" fill="none" stroke="#ff9e42" stroke-opacity=".13" stroke-width="2"/>
<path d="M742 129C952 68 1117 196 1150 369" fill="none" stroke="#ffc36d" stroke-opacity=".1" stroke-width="1"/>
<!-- restrained browser-like top bar -->
<rect x="0" y="0" width="1200" height="98" fill="#100f0e" fill-opacity=".62"/>
<path d="M0 98H1200" stroke="#fff" stroke-opacity=".13"/>
<g transform="translate(64 31)"><rect width="42" height="38" rx="11" fill="#fa7e32"/><path d="M10 13h22M10 19h16M10 25h19" stroke="#28140e" stroke-width="2.4" stroke-linecap="round"/><text x="56" y="17" fill="#fff3df" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" letter-spacing="1.5">SMASH <tspan fill="#ff9947">&amp;</tspan> SIZZLE</text><text x="57" y="33" fill="#c7a18a" font-family="Arial,Helvetica,sans-serif" font-size="8.5" letter-spacing="3.2">FRESH OFF THE GRIDDLE</text></g>
<g fill="#dbc9b8" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="1.7"><text x="690" y="53">THE MENU</text><text x="796" y="53">OUR STORY</text><text x="909" y="53">FIND US</text></g>
<rect x="1000" y="27" width="135" height="43" rx="21.5" fill="#ff8739"/><text x="1067.5" y="53" text-anchor="middle" fill="#22130f" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="800" letter-spacing="1.2">ORDER NOW</text>
<!-- left editorial headline -->
<g transform="translate(68 204)">
  <rect x="0" y="0" width="185" height="29" rx="14.5" fill="#fa7d31" fill-opacity=".13" stroke="#fa9b55" stroke-opacity=".4"/>
  <circle cx="17" cy="14.5" r="3.5" fill="#ffa247"/><text x="30" y="18.5" fill="#ffc48b" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.9">SMASHED FRESH · SEARED HOT</text>
  <text x="-3" y="128" fill="#fff0dc" font-family="Georgia,'Times New Roman',serif" font-size="76" letter-spacing="-3.5">BIG FLAVOUR.</text>
  <text x="-1" y="208" fill="#ff9b45" font-family="Georgia,'Times New Roman',serif" font-size="70" font-style="italic" letter-spacing="-3.5">NO SHORTCUTS.</text>
  <path d="M1 229H260" stroke="#ff943d" stroke-width="2" stroke-opacity=".8"/>
  <text x="1" y="272" fill="#ded0c1" font-family="Arial,Helvetica,sans-serif" font-size="16">Hot iron. House sauce. Every bite</text>
  <text x="1" y="297" fill="#ded0c1" font-family="Arial,Helvetica,sans-serif" font-size="16">made to bring you back for more.</text>
  <rect x="0" y="337" width="190" height="52" rx="26" fill="#ff8739"/>
  <text x="25" y="368" fill="#24130e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="800" letter-spacing="1.2">EXPLORE THE MENU</text><path d="M158 361h9m-4-4 4 4-4 4" fill="none" stroke="#24130e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="226" cy="363" r="25" fill="none" stroke="#e5c8ad" stroke-opacity=".65"/><path d="M218 363h15m-6 -6 6 6-6 6" fill="none" stroke="#f4e4d1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1" y="433" fill="#bda28e" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing="2.3">MADE WITH FIRE. SERVED WITH ATTITUDE.</text>
</g>
